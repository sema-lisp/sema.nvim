name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: stylua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

      - name: luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: . --no-color -q

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true

      - name: Test plugin registration
        run: nvim --headless -u NONE '+lua dofile("tests/plugin_spec.lua")' +qa
